name: RP

on:
  push:
    branches: [main]
    paths: ['rp/**', '.github/workflows/rp.yml']
  pull_request:
    paths: ['rp/**', '.github/workflows/rp.yml']

jobs:
  verify:
    # Runs against the committed Swift-issued fixture, so no Swift toolchain
    # and no macOS runner is needed. The live cross-implementation suite skips
    # itself here and runs in the iOS workflow instead.
    name: 検証ロジック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --test
        working-directory: rp
        run: node --test
