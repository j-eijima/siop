name: RP

on:
  push:
    branches: [main]
    paths: ['rp/**', 'ios/SIOPKit/**', '.github/workflows/rp.yml']
  pull_request:
    paths: ['rp/**', 'ios/SIOPKit/**', '.github/workflows/rp.yml']

jobs:
  cross-implementation:
    # Tokens are signed by the Swift implementation and verified by the
    # JavaScript one, so this needs both toolchains.
    name: 実装間テスト (Swift が署名 → JavaScript が検証)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --test
        working-directory: rp
        run: node --test test/verify.test.mjs
