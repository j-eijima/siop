name: Docs

on:
  push:
    branches: [main]
    paths: ['**.md', 'tools/check-docs.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', 'tools/check-docs.py', '.github/workflows/docs.yml']

jobs:
  check:
    # Keeping a translation faithful is a human job, but a pair falling apart
    # is mechanical: a section added on one side only, a dead link, a missing
    # counterpart. Those are checked here.
    name: 英語版と日本語版の整合
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-docs.py
