name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'rp/test/fixtures/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'rp/test/fixtures/**', '.github/workflows/android.yml']

jobs:
  siopkit:
    # A plain JVM module, so no Android SDK is needed. Its tests include
    # verifying a Swift-signed token, which comes from a committed fixture.
    name: siopkit unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle test
        working-directory: android
        run: gradle :siopkit:test --console=plain
