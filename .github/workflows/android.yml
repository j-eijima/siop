name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'rp/test/fixtures/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'rp/test/fixtures/**', '.github/workflows/android.yml']

jobs:
  siopkit:
    # A plain JVM module, so no Android SDK is needed. Its tests include
    # verifying a Swift-signed token, which comes from a committed fixture.
    name: siopkit unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper pins Gradle: the Android plugin does not work on every
      # version, and the machine's Gradle is not necessarily one it accepts.
      - name: siopkit tests
        working-directory: android
        run: ./gradlew :siopkit:test --console=plain
      - name: Build the app
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain
